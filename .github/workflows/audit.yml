name: Workflow self-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run machine-checkable self-audit
        run: python3 tools/audit.py
      - name: Build and validate clean Starter artifact
        run: python3 tools/build_starter.py --output "$RUNNER_TEMP/token-efficient-spec-kit-starter.zip"
