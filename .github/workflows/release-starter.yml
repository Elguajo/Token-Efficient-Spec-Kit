name: Publish Starter asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '\\n' < VERSION)"
          test "${{ github.event.release.tag_name }}" = "v${version}"

      - name: Build clean Starter archive
        run: python3 tools/build_starter.py --output "$RUNNER_TEMP/token-efficient-spec-kit-starter.zip"

      - name: Attach Starter archive to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/token-efficient-spec-kit-starter.zip" --clobber
